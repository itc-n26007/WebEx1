<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>灯台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>灯台に到着</h1>

    <p>
        あなたは森を抜け、島の反対側にある灯台へたどり着いた。
    </p>

    <p>
        灯台の頂上には、大きな無線アンテナが設置されている。
    </p>

    <p>
        持ってきた無線機をアンテナに接続すると、
        少しずつ電波が強くなっていく。
    </p>

    <p>
        「こちら救助隊。応答してください。」
    </p>

    <p>
        無線機から声が聞こえてきた。
    </p>

    <p>
        あなたは急いで自分のいる場所を伝え、
        助けを求めた。
    </p>

    <p>
        しばらくすると、遠くから船の音が聞こえてきた。
    </p>

    <h2>脱出成功！</h2>

    <p>
        救助隊があなたを見つけてくれた。
    </p>

    <p>
        長い無人島生活は終わり、あなたは無事に島を脱出することができた。
    </p>

    <h2>GAME CLEAR</h2>

    <p>
        <a href="index.html">最初から遊ぶ</a>
    </p>

</body>
</html>
